# Конфигурация ruff для backend SberAct.
# Цель — ловить РЕАЛЬНЫЕ баги в коде разбора/генерации, а не нагружать
# косметикой: стиль приводит в порядок `ruff format`, а здесь — только то,
# что может сломать поведение.

target-version = "py312"
line-length = 120  # код разбора содержит длинные регулярки и метки — не дробим

# venv и сгенерированные эталоны golden не линтуем.
extend-exclude = ["venv", "tests/golden/snapshots", "tests/golden_gen/snapshots"]

[lint]
# F   — pyflakes: необъявленные/неиспользуемые имена, битые f-строки (реальные ошибки).
# E9  — синтаксис и ошибки времени выполнения.
# B   — flake8-bugbear: типичные ловушки (raise без from, изменяемые дефолты и т.п.).
# I   — сортировка импортов (авто-фиксится).
select = ["F", "E9", "B", "I"]

ignore = [
    "F541",  # f-строка без подстановок — безвредно, встречается в логах
    "B008",  # вызов в значении по умолчанию — осознанно используется в сигнатурах
]

[lint.per-file-ignores]
# В тестах допустимы неиспользуемые импорты-фикстуры и т.п.
"tests/**" = ["F401", "F811"]
